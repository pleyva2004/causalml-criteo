[project]
name = "causalml-criteo"
version = "0.1.0"
description = "Classical ML and causal inference on the Criteo Uplift dataset: prediction, calibration, treatment effects, uplift modeling, and budget-constrained targeting"
readme = "README.md"
authors = [
    { name = "Pablo Leyva", email = "141463423+pleyva2004@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dowhy>=0.14",
    "econml>=0.17.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scikit-uplift>=0.5.1",
    "scipy>=1.15.3",
    "shap>=0.49.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
causalml = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
